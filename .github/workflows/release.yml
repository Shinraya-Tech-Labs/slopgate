name: Publish Release

on:
  push:
    # Version tags only: the floating `v0` tag must not start a release run.
    tags:
      - 'v*.*.*'

# Build and publish are separate jobs with separate privileges. Building the
# package must never share a job with the PyPI token.
permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Verify tag matches package version
        run: |
          VERSION=$(python -c "import slopgate; print(slopgate.__version__)")
          test "v$VERSION" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          }
      - name: Verify changelog entry
        # Fail before publishing if CHANGELOG.md has no section for this tag.
        run: python scripts/changelog_section.py --require "$GITHUB_REF_NAME"
      - name: Build Package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): configure the pending publisher on PyPI with
    # owner Shinraya-Tech-Labs, repo slopgate, workflow release.yml, no environment.
    # https://pypi.org/manage/account/publishing/
    permissions:
      id-token: write
      attestations: write
    env:
      # Secrets are not available in step `if` conditions, so expose the token here.
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish with API token
        # Used when PYPI_API_TOKEN is configured; otherwise OIDC below takes over.
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish with Trusted Publishing
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG
        run: python3 scripts/changelog_section.py "$GITHUB_REF_NAME" > notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: SlopGate ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
