name: 'SlopGate PR Integrity Shield'
description: '🛡️ Stop AI slop PRs before they burn out maintainers. AST-based test tamper detection & phantom symbol interception.'
author: 'Shinraya Tech Labs'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  fail-on:
    description: 'When to fail the CI step (blocked, warning, never)'
    required: false
    default: 'blocked'
  summary:
    description: 'Whether to post markdown results to GITHUB_STEP_SUMMARY'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Run SlopGate Integrity Check
      shell: bash
      env:
        # Never let the checked-out PR shadow the slopgate package: with `python -m`
        # the working directory comes before PYTHONPATH, so a PR adding its own
        # slopgate/ package would execute arbitrary code in this workflow.
        PYTHONSAFEPATH: '1'
        PYTHONPATH: ${{ github.action_path }}
        SLOPGATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail
        SUMMARY_ARG=""
        if [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          SUMMARY_ARG="--summary-file $GITHUB_STEP_SUMMARY"
        fi

        python -m slopgate.cli check \
          --format github \
          --fail-on "$INPUT_FAIL_ON" \
          $SUMMARY_ARG
